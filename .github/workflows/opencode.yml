name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  opencode:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/opencode')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/opencode')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/opencode')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '/opencode') || contains(github.event.issue.title, '/opencode')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run opencode
        uses: sst/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zhipuai/glm-4.5
          share: true
          github_token: ${{ secrets.GITHUB_TOKEN }}