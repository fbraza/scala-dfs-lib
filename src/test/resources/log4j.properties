# Root logger configuration - set to WARN to reduce overall verbosity
log4j.rootLogger=WARN, stdout

# Console appender configuration
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# Hadoop/HDFS specific loggers - set to ERROR to minimize noise
log4j.logger.org.apache.hadoop=ERROR
log4j.logger.org.apache.hadoop.hdfs=ERROR
log4j.logger.org.apache.hadoop.hdfs.server.datanode=ERROR
log4j.logger.org.apache.hadoop.hdfs.server.namenode=ERROR
log4j.logger.org.apache.hadoop.hdfs.server.blockmanagement=ERROR
log4j.logger.org.apache.hadoop.hdfs.DFSClient=ERROR
log4j.logger.org.apache.hadoop.hdfs.MiniDFSCluster=ERROR
log4j.logger.org.apache.hadoop.security=ERROR
log4j.logger.org.apache.hadoop.ipc=ERROR
log4j.logger.org.apache.hadoop.metrics2=ERROR
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR

# Additional noisy components
log4j.logger.org.apache.hadoop.fs.FileSystem=ERROR
log4j.logger.org.apache.hadoop.conf.Configuration=ERROR
log4j.logger.org.mortbay.log=ERROR
log4j.logger.org.eclipse.jetty=ERROR

# Keep your DFS library logs visible (adjust as needed)
log4j.logger.dfs=INFO

# ScalaTest logs
log4j.logger.org.scalatest=INFO

# If you want to see specific Hadoop logs for debugging, uncomment these:
# log4j.logger.org.apache.hadoop.hdfs.MiniDFSCluster=DEBUG
# log4j.logger.org.apache.hadoop.hdfs.server.namenode=DEBUG